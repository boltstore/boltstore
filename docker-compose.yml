version: "3.8"

# Docker Compose example for Boltstore.
#
# Usage:
#   docker compose up -d
#
# The data directory uses a bind mount (./data) so SQLite databases
# survive container/image deletions and are directly accessible from the host.
# Works on macOS, Linux, and Windows.

services:
  boltstore:
    build:
      context: .
      dockerfile: Dockerfile
    image: boltstore:latest
    container_name: boltstore
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_PATH: /app/data
      LOG_LEVEL: info
      # Backend is UTC-only — no timezone config needed.
      # Rate limiting is the operator's responsibility (reverse proxy / WAF).
      # Set CORS_ORIGINS to an explicit comma-separated list in production.
      # CORS_ORIGINS: "https://app.example.com,https://admin.example.com"
    volumes:
      # Bind mount — data survives container/image removal and is directly
      # accessible at ./data/ on the host (macOS, Linux, Windows).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
