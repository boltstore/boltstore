name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: npm publish --provenance --access public

  build-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            out: boltstore-linux-x64
          - target: bun-darwin-arm64
            os: macos-latest
            out: boltstore-darwin-arm64
          - target: bun-darwin-x64
            os: macos-latest
            out: boltstore-darwin-x64
          - target: bun-windows-x64
            os: windows-latest
            out: boltstore-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun build --compile --target=${{ matrix.target }} --outfile=${{ matrix.out }} ./src/entry.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  create-release:
    needs: [publish, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: boltstore-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: boltstore-*
          generate_release_notes: true
