name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun test

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - run: bun install
      - run: bun run build
      - name: Ensure latest npm CLI
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --provenance --access public
        continue-on-error: true

  build-binaries:
    needs: [test]
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            out: boltstore-linux-x64
          - target: bun-darwin-arm64
            os: macos-latest
            out: boltstore-darwin-arm64
          - target: bun-darwin-x64
            os: macos-latest
            out: boltstore-darwin-x64
          - target: bun-windows-x64
            os: windows-latest
            out: boltstore-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun run build
      - run: npm install
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: bun build --compile --target=${{ matrix.target }} --outfile=${{ matrix.out }} --embed='admin/dist/*' ./src/entry.ts
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  create-release:
    needs: [test, publish, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: boltstore-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: boltstore-*
          generate_release_notes: true
